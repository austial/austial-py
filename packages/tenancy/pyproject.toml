[project]
name = "austial-tenancy"
dynamic = ["version"]
description = "Multi-tenant primitives -- request-scoped TenantContext, TenantGuard, Tenanted entity mixin, tenant-scope enforcement (mirrors @nestjs/microservices' scope patterns, adapted for HTTP)."
requires-python = ">=3.11"
dependencies = [
    "austial-common",
    "austial-core",
    "austial-auth",
    "austial-orm",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-common = { workspace = true }
austial-core = { workspace = true }
austial-auth = { workspace = true }
austial-orm = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
