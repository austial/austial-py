[project]
name = "austial-cli"
version = "0.1.1"
description = "The `austial` scaffolding CLI (new/generate) and its Jinja2 project templates -- mirrors the separate @nestjs/cli repo."
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]
