[project]
name = "austial-cli"
dynamic = ["version"]
description = "The `austial` scaffolding CLI (new/generate) and its Jinja2 project templates -- mirrors the separate @nestjs/cli repo."
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.0",
    "rich>=13.7.0",
    "typer>=0.27.3",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
