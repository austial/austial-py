[project]
name = "austial-config"
version = "0.1.1"
description = "ConfigModule/ConfigService for .env-backed configuration -- mirrors @nestjs/config (no main-monorepo equivalent)."
requires-python = ">=3.11"
dependencies = [
    "austial-common",
    "austial-core",
    "pydantic-settings>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-common = { workspace = true }
austial-core = { workspace = true }
