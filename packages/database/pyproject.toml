[project]
name = "austial-database"
dynamic = ["version"]
description = "DatabaseModule wrapping SQLAlchemy's async engine/session -- mirrors @nestjs/typeorm (no main-monorepo equivalent)."
requires-python = ">=3.11"
dependencies = [
    "austial-common",
    "austial-core",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-common = { workspace = true }
austial-core = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
