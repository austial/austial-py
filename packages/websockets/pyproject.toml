[project]
name = "austial-websockets"
dynamic = ["version"]
description = "WebSockets -- gateways, @SubscribeMessage, rooms and broadcasting over Starlette; mirrors @nestjs/websockets."
requires-python = ">=3.11"
dependencies = [
    "austial-common",
    "austial-core",
]

[project.optional-dependencies]
socketio = ["python-socketio>=5.11"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-common = { workspace = true }
austial-core = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
