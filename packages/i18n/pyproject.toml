[project]
name = "austial-i18n"
dynamic = ["version"]
description = "Server-side i18n -- one JSON file per module per locale, merged into a `<module>.<key>` lookup namespace with request-scoped locale context and Accept-Language middleware."
requires-python = ">=3.11"
dependencies = [
    "austial-common",
    "austial-core",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-common = { workspace = true }
austial-core = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
