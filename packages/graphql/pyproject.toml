[project]
name = "austial-graphql"
dynamic = ["version"]
description = "GraphQL -- mounts a Strawberry schema with DI-aware context; mirrors @nestjs/graphql."
requires-python = ">=3.11"
dependencies = [
    "austial-common",
    "austial-core",
]

[project.optional-dependencies]
strawberry = [
    "strawberry-graphql[fastapi]>=0.250",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-common = { workspace = true }
austial-core = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
