[project]
name = "austial"
dynamic = ["version"]
description = "A NestJS-like web framework for Python on FastAPI: modules, controllers, dependency injection, guards, pipes, an ORM, auth and a CLI."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aayush Solanki" }]
keywords = [
    "austial",
    "nestjs",
    "nestjs-like",
    "nestjs-style",
    "nestjs-for-python",
    "python-nestjs",
    "fastapi",
    "python",
    "web-framework",
    "dependency-injection",
    "asgi",
    "decorators",
    "async",
    "pydantic",
    "framework",
    "backend",
    "api",
    "rest",
    "openapi",
    "cli",
    "microservices",
    "orm",
    "authentication",
    "jwt",
    "multi-tenancy",
    "guards",
    "modules",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
license = { text = "MIT" }
dependencies = [
    "austial-core",
    "austial-microservices",
    "austial-orm",
    "austial-auth",
    "austial-cli",
]

[project.optional-dependencies]
# Forwarded to the package that owns the integration, e.g. `pip install 'austial[socketio,redis]'`.
strawberry = ["austial-core[strawberry]"]
socketio = ["austial-core[socketio]"]
redis = ["austial-microservices[redis]"]
nats = ["austial-microservices[nats]"]
kafka = ["austial-microservices[kafka]"]
mqtt = ["austial-microservices[mqtt]"]
rabbitmq = ["austial-microservices[rabbitmq]"]
grpc = ["austial-microservices[grpc]"]
grpc-proto = ["austial-microservices[grpc-proto]"]
lambda = ["austial-core[lambda]"]
pymongo = ["austial-orm[pymongo]"]

[project.scripts]
austial = "austial.cli.main:run"

[project.urls]
Homepage = "https://austial.com"
Documentation = "https://docs.austial.com"
Guides = "https://austial.com/guides"
Repository = "https://github.com/austial/austial-py"
Issues = "https://github.com/austial/austial-py/issues"
Issues = "https://github.com/austial/austial-py/issues"
Changelog = "https://github.com/austial/austial-py/releases"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-core = { workspace = true }
austial-microservices = { workspace = true }
austial-orm = { workspace = true }
austial-auth = { workspace = true }
austial-cli = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
