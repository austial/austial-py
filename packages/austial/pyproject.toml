[project]
name = "austial"
dynamic = ["version"]
description = "A NestJS-inspired, batteries-included web framework for Python, built on top of FastAPI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
urls = { Homepage = "https://github.com/austial/austial-py", Repository = "https://github.com/austial/austial-py", Issues = "https://github.com/austial/austial-py/issues" }
dependencies = [
    "austial-common",
    "austial-core",
    "austial-config",
    "austial-orm",
    "austial-terminus",
    "austial-testing",
    "austial-cli",
]

[project.scripts]
austial = "austial.cli.main:run"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-common = { workspace = true }
austial-core = { workspace = true }
austial-config = { workspace = true }
austial-orm = { workspace = true }
austial-terminus = { workspace = true }
austial-testing = { workspace = true }
austial-cli = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
