[project]
name = "austial-security"
dynamic = ["version"]
description = "Security primitives -- secure headers, rate limiting, idempotency, CSRF, PII redaction, envelope encryption."
requires-python = ">=3.11"
dependencies = [
    "austial-common",
    "austial-core",
    "cryptography>=43.0.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-common = { workspace = true }
austial-core = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
