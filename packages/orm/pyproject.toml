[project]
name = "austial-orm"
dynamic = ["version"]
description = "Data access: a TypeORM-shaped ORM (entities, relations, Repository, QueryBuilder, DataSource), Alembic migrations, MongoDB models, Prisma wiring, audit log and multi-tenancy."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aayush Solanki" }]
keywords = [
    "austial",
    "nestjs",
    "fastapi",
    "python",
    "web-framework",
    "dependency-injection",
    "asgi",
    "decorators",
    "async",
    "pydantic",
    "orm",
    "sqlalchemy",
    "typeorm",
    "mongodb",
    "migrations",
    "alembic",
    "prisma",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "austial-core",
    "sqlalchemy>=2.1.8",
    # SQLAlchemy's async engine requires greenlet, but SQLAlchemy only pulls it in on some
    # platforms/Python versions (it does not on 3.14), so declare it explicitly.
    "greenlet>=3.1.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
pymongo = ["pymongo>=4.9"]                               # austial.mongo

[project.urls]
Homepage = "https://github.com/austial/austial-py"
Documentation = "https://docs.austial.com"
Repository = "https://github.com/austial/austial-py"
Issues = "https://github.com/austial/austial-py/issues"
Changelog = "https://github.com/austial/austial-py/releases"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-core = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
