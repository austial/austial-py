[project]
name = "austial-orm"
dynamic = ["version"]
description = "Data access: a TypeORM-shaped ORM (entities, relations, Repository, QueryBuilder, DataSource), Alembic migrations, MongoDB models, Prisma wiring, audit log and multi-tenancy."
requires-python = ">=3.11"
dependencies = [
    "austial-core",
    "sqlalchemy>=2.1.8",
    # SQLAlchemy's async engine requires greenlet, but SQLAlchemy only pulls it in on some
    # platforms/Python versions (it does not on 3.14), so declare it explicitly.
    "greenlet>=3.1.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
pymongo = ["pymongo>=4.9"]                               # austial.mongo

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-core = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
