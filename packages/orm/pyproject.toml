[project]
name = "austial-orm"
dynamic = ["version"]
description = "A from-scratch, TypeORM-shaped ORM (entities, relations, Repository, QueryBuilder, DataSource) -- mirrors typeorm, with SQLAlchemy Core hidden behind a pluggable Driver as the SQL-compilation/pooling layer."
requires-python = ">=3.11"
dependencies = [
    "austial-common",
    "austial-core",
    "sqlalchemy>=2.0.30",
    # SQLAlchemy's async engine requires greenlet, but SQLAlchemy only pulls it in on some
    # platforms/Python versions (it does not on 3.14), so declare it explicitly.
    "greenlet>=3.1.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-common = { workspace = true }
austial-core = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
