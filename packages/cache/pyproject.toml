[project]
name = "austial-cache"
dynamic = ["version"]
description = "Caching -- CacheModule, CacheService, an in-memory TTL/LRU store, CacheInterceptor and @CacheKey/@CacheTTL; mirrors @nestjs/cache-manager."
requires-python = ">=3.11"
dependencies = [
    "austial-common",
    "austial-core",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-common = { workspace = true }
austial-core = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
