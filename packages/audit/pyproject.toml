[project]
name = "austial-audit"
dynamic = ["version"]
description = "WORM audit log -- append-only AuditLogEntry, AuditLogService, @Audited interceptor, retention with legal hold (IFSCA + OWASP ASVS V7 + ISO A.5.24)."
requires-python = ">=3.11"
dependencies = [
    "austial-common",
    "austial-core",
    "austial-orm",
    # Only for ``jsonable_encoder`` in the ``@Audited(capture_result=True)`` path -- ``austial-core``
    # already pulls fastapi in transitively, but the interceptor imports it directly.
    "fastapi",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-common = { workspace = true }
austial-core = { workspace = true }
austial-orm = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
