[project]
name = "austial-http"
dynamic = ["version"]
description = "HTTP client -- HttpModule/HttpService over httpx with retries, interceptors and lifecycle-managed connections; mirrors @nestjs/axios."
requires-python = ">=3.11"
dependencies = [
    "austial-common",
    "austial-core",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-common = { workspace = true }
austial-core = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
