[project]
name = "austial-auth"
dynamic = ["version"]
description = "Identity and access: authentication (Argon2, JWT, TOTP, OAuth2/OIDC, strategies), authorization (roles, permissions) and security (headers, rate limiting, CSRF, encryption)."
requires-python = ">=3.11"
dependencies = [
    "austial-core",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.9.0",
    "pyotp>=2.9.0",
    "httpx>=0.27",
    "cryptography>=43.0.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-core = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
