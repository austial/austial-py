[project]
name = "austial-auth"
dynamic = ["version"]
description = "Authentication primitives -- Argon2 hasher, JWT strategy, TOTP MFA, AuthGuard, refresh-token store -- mirrors @nestjs/passport + @nestjs/jwt."
requires-python = ">=3.11"
dependencies = [
    "austial-common",
    "austial-core",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.9.0",
    "pyotp>=2.9.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-common = { workspace = true }
austial-core = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
