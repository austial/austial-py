[project]
name = "austial-core"
dynamic = ["version"]
description = "The DI container, module scanner, router and application bootstrap -- mirrors @nestjs/core."
requires-python = ">=3.11"
dependencies = [
    "austial-common",
    "fastapi>=0.162.0",
    "starlette",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-common = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
