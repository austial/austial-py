[project]
name = "austial-storage"
dynamic = ["version"]
description = "File / blob storage abstraction -- local filesystem driver, optional S3 driver, HMAC-signed download URLs and pluggable virus scanning."
requires-python = ">=3.11"
dependencies = [
    "austial-common",
    "austial-core",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-common = { workspace = true }
austial-core = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
