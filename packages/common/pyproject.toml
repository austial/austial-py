[project]
name = "austial-common"
dynamic = ["version"]
description = "Decorators, exceptions, pipes, guards and other symbols shared across Austial -- mirrors @nestjs/common."
requires-python = ">=3.11"
dependencies = [
    "austial-core",
    "fastapi>=0.162.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "starlette",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-core = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
