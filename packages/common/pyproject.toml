[project]
name = "austial-common"
version = "0.1.1"
description = "Decorators, exceptions, pipes, guards and other symbols shared across Austial -- mirrors @nestjs/common."
requires-python = ">=3.11"
dependencies = [
    "austial-core",
    "fastapi>=0.115.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "starlette",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-core = { workspace = true }
