[project]
name = "austial-jobs"
dynamic = ["version"]
description = "Background-job runner -- @Cron scheduled jobs, @Job enqueueable tasks, JobQueue, Worker, pluggable backend (in-memory default)."
requires-python = ">=3.11"
dependencies = [
    "austial-common",
    "austial-core",
    "typer>=0.12.0",
]

[project.scripts]
austial-worker = "austial.jobs.cli:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-common = { workspace = true }
austial-core = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
