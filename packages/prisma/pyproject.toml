[project]
name = "austial-prisma"
dynamic = ["version"]
description = "Prisma -- PrismaModule that connects/disconnects any Prisma-style client with the app lifecycle; mirrors the Prisma recipe."
requires-python = ">=3.11"
dependencies = [
    "austial-common",
    "austial-core",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-common = { workspace = true }
austial-core = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
