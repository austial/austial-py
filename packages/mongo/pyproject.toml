[project]
name = "austial-mongo"
dynamic = ["version"]
description = "MongoDB -- MongoModule providing a lifecycle-managed async client, database and InjectCollection; mirrors @nestjs/mongoose."
requires-python = ">=3.11"
dependencies = [
    "austial-common",
    "austial-core",
]

[project.optional-dependencies]
pymongo = [
    "pymongo>=4.9",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-common = { workspace = true }
austial-core = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
