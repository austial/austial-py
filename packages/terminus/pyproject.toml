[project]
name = "austial-terminus"
version = "0.1.1"
description = "Health-check aggregator and indicators (memory, database) -- mirrors @nestjs/terminus (no main-monorepo equivalent)."
requires-python = ">=3.11"
dependencies = [
    "austial-common",
    "austial-database",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-common = { workspace = true }
austial-database = { workspace = true }
