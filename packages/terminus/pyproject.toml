[project]
name = "austial-terminus"
dynamic = ["version"]
description = "Health-check aggregator and indicators (memory, database) -- mirrors @nestjs/terminus (no main-monorepo equivalent)."
requires-python = ">=3.11"
dependencies = [
    "austial-common",
    "austial-orm",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-common = { workspace = true }
austial-orm = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
