[project]
name = "austial-schedule"
dynamic = ["version"]
description = "Task scheduling -- @Cron, @Interval, @Timeout and a runtime SchedulerRegistry; mirrors @nestjs/schedule."
requires-python = ">=3.11"
dependencies = [
    "austial-common",
    "austial-core",
    "austial-jobs",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-common = { workspace = true }
austial-core = { workspace = true }
austial-jobs = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
