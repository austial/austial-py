[project]
name = "austial-testing"
version = "0.1.1"
description = "TestingModule builder for overriding providers in unit/e2e tests -- mirrors @nestjs/testing."
requires-python = ">=3.11"
dependencies = [
    "austial-common",
    "austial-core",
    "fastapi>=0.115.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-common = { workspace = true }
austial-core = { workspace = true }
