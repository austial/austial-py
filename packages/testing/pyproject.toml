[project]
name = "austial-testing"
dynamic = ["version"]
description = "TestingModule builder for overriding providers in unit/e2e tests -- mirrors @nestjs/testing."
requires-python = ">=3.11"
dependencies = [
    "austial-common",
    "austial-core",
    "fastapi>=0.162.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austial"]

[tool.uv.sources]
austial-common = { workspace = true }
austial-core = { workspace = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
