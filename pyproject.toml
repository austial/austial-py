
# Virtual workspace root -- this project itself is not published. It only wires
# together the installable sub-packages under packages/ (each with its own
# pyproject.toml) into a single shared uv-managed virtualenv, the same role
# lerna.json + the root package.json "workspaces" field play in nestjs/nest.
[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=5.0.0",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "integration"]
python_files = ["*_spec.py", "test_*.py", "*_test.py"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["packages/cli/src/austial/cli/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # function calls in default args (`Body()`, `Query()`, ... -- FastAPI's own idiom)

[tool.ruff.lint.isort]
known-first-party = ["austial"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
explicit_package_bases = true
exclude = ["packages/cli/src/austial/cli/templates/", "build/"]
# Every sub-package's `austial.*` namespace is merged at runtime via `pkgutil.extend_path()`
# (see `packages/austial/src/austial/__init__.py`) -- mypy has no static equivalent for that, so
# without every package's `src/` on `mypy_path`, an absolute `from austial.orm import ...` in a
# file mypy analyzes outside `packages/orm` (e.g. any *other* package's test suite) silently
# resolves to `Any` instead of erroring (masked by `ignore_missing_imports`), which is exactly
# how `@Entity()`'s `dataclass_transform`-synthesized `__init__` went unchecked before this fix.
mypy_path = [
    "packages/austial/src",
    "packages/auth/src",
    "packages/authz/src",
    "packages/audit/src",
    "packages/cache/src",
    "packages/events/src",
    "packages/cli/src",
    "packages/i18n/src",
    "packages/jobs/src",
    "packages/migrations/src",
    "packages/security/src",
    "packages/storage/src",
    "packages/tenancy/src",
    "packages/common/src",
    "packages/config/src",
    "packages/core/src",
    "packages/orm/src",
    "packages/terminus/src",
    "packages/testing/src",
    # `packages/orm/test` has no `__init__.py` (pytest rootdir-inserts it onto `sys.path`,
    # exactly like every other package's `test/`), but its `fixtures/` subpackage *does* have
    # one -- so `fixtures.entities` is importable at runtime. Without this on `mypy_path`,
    # mypy computes two different module names for the same file (`fixtures.entities` when
    # resolving `entity_metadata_spec.py`'s `from fixtures.entities import ...`, vs.
    # `packages.orm.test.fixtures.entities` when directory-walking `packages` directly, since
    # `packages/orm/test` matches no known source root) -- the same "found twice" class of bug
    # `explicit_package_bases` above exists to prevent, just one level deeper.
    "packages/orm/test",
]

[tool.coverage.run]
source = ["packages"]
omit = ["*/test/*", "*/templates/*"]

[tool.coverage.report]
# Ratchet: current coverage is ~91%. Raise this as it grows; never lower it to land a change.
fail_under = 88
show_missing = true
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@abstractmethod"]
