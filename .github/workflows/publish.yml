name: Publish

# Cuts a release whenever a `v*.*.*` tag is pushed (e.g. `git tag -a v0.1.1 &&
# git push origin v0.1.1`): runs the same lint/type-check/test gate as
# pre-commit, builds the sdist/wheel for every workspace package once, then
# publishes each of the 29 distributions to PyPI via trusted publishing (OIDC
# -- no long-lived API token stored as a secret), and finally attaches the
# built artifacts to a GitHub release.
#
# IMPORTANT: publishing runs as a job matrix -- one job per PyPI project,
# each minting its OWN OIDC token. Trusted-publishing OIDC tokens are scoped
# to a single PyPI project per mint request; funnelling all 29 projects'
# files through one `pypa/gh-action-pypi-publish` call in a single job (the
# previous setup) causes PyPI to reject every project's upload except the
# one its token happened to get scoped to, with:
#   403 Invalid API Token: OIDC scoped token is not valid for project 'x'
# See https://github.com/pypa/gh-action-pypi-publish#trusted-publishing --
# "if uploading to multiple indices/projects, use a separate job (and
# therefore a separate OIDC token) per project."
#
# One-time setup required on PyPI before the first run of a NEW package: this
# publishes 29 separate distributions, one per packages/* workspace member
# (austial, austial-common, austial-core, austial-config, austial-orm,
# austial-terminus, austial-testing, austial-cli, austial-auth, austial-authz,
# austial-tenancy, austial-security, austial-audit, austial-jobs,
# austial-storage, austial-i18n, austial-migrations, austial-cache,
# austial-events). Each is its own PyPI
# project and needs its OWN
# "pending publisher" (or trusted publisher once it exists) added on its
# https://pypi.org/manage/project/<name>/settings/publishing/ page (for a project
# that does not exist yet: https://pypi.org/manage/account/publishing/) with:
#   owner: austial   repo: austial-py   workflow: publish.yml   environment: pypi

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy packages

      - name: Test
        run: uv run pytest -q

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Build sdist + wheel for every workspace package
        run: uv build --all-packages --out-dir dist

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish ${{ matrix.package }} to PyPI
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - austial
          - austial-common
          - austial-core
          - austial-config
          - austial-orm
          - austial-terminus
          - austial-testing
          - austial-cli
          - austial-auth
          - austial-authz
          - austial-tenancy
          - austial-security
          - austial-audit
          - austial-jobs
          - austial-storage
          - austial-i18n
          - austial-cache
          - austial-events
          - austial-http
          - austial-schedule
          - austial-cqrs
          - austial-websockets
          - austial-microservices
          - austial-openapi
          - austial-graphql
          - austial-mongo
          - austial-prisma
          - austial-commander
          - austial-migrations
    environment:
      name: pypi
      url: https://pypi.org/project/${{ matrix.package }}/
    permissions:
      id-token: write  # mint this project's own PyPI trusted-publishing OIDC token
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Select this project's distribution files
        run: |
          mkdir -p dist-selected
          normalized="${PACKAGE//-/_}"
          cp "dist/${normalized}-"* dist-selected/
          ls -l dist-selected
        env:
          PACKAGE: ${{ matrix.package }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-selected

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub release
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
