name: Claude PR review

# Automatic review of every non-draft PR opened from this repository. Fork PRs are skipped on purpose:
# they have no access to secrets, and running an LLM with write-scoped tokens over untrusted diffs is a
# prompt-injection risk. Findings are advisory; CI is the merge gate.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request as the Austial framework maintainer. Read CLAUDE.md first and
            apply its "Architecture notes" and "Definition of done". Check, in order: correctness,
            DI/scope/lifecycle invariants (lazy route building, request-scope bubbling, filter chain),
            public-API consistency (exports, __all__, NestJS naming), test coverage of every new
            branch, and whether docs in austial-py-doc need updating. Use inline comments for specific
            problems and one short summary comment. Do not comment on formatting that ruff enforces.
            Do not approve or request changes.
          claude_args: |
            --max-turns 12
            --allowedTools "Read,Glob,Grep,Bash(git diff *),Bash(git log *)"
