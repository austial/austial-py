name: Bug report
description: Something behaves differently from the docs or from NestJS
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A small module/controller and the request that triggers it.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: austial version and Python version
    validations:
      required: true
