# Live brokers for integration/brokers_spec.py:   docker compose -f docker-compose.brokers.yml up -d --wait
# then:  see the AUSTIAL_TEST_* variables at the top of integration/brokers_spec.py (or `source integration/env.sh`).
services:
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 3s, timeout: 3s, retries: 20}
  nats:
    image: nats:2
    ports: ["4222:4222"]
  rabbitmq:
    image: rabbitmq:3
    ports: ["5672:5672"]
    healthcheck: {test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 5s, timeout: 5s, retries: 20}
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    healthcheck: {test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"], interval: 3s, timeout: 5s, retries: 20}
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: ["./integration/docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 30
